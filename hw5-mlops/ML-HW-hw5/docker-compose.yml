services:
  postgres:
    image: postgres:16
    container_name: hw5-feast-postgres
    environment:
      POSTGRES_USER: feast
      POSTGRES_PASSWORD: feast
      POSTGRES_DB: feast
    ports:
      - "5433:5432"
    volumes:
      - feast-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U feast -d feast"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  feast-pg-data:
