name: Deploy

on:
  push:
    branches: [main]
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      model_version:
        description: "MODEL_VERSION для билда"
        required: false
        default: "v1.0.0"

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  MODEL_VERSION: ${{ github.event.inputs.model_version || vars.MODEL_VERSION || 'v1.0.0' }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}
      image_name: ${{ steps.meta.outputs.image_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # GHCR требует lowercase в repository-части тега.
      - id: meta
        name: Resolve image name and tags
        run: |
          short_sha=${GITHUB_SHA::7}
          image_name="${REGISTRY}/${GITHUB_REPOSITORY,,}"
          echo "image_tag=${short_sha}" >> "$GITHUB_OUTPUT"
          echo "image_name=${image_name}" >> "$GITHUB_OUTPUT"
          echo "Building ${image_name} with MODEL_VERSION=${MODEL_VERSION}"

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.image_name }}:${{ steps.meta.outputs.image_tag }}
            ${{ steps.meta.outputs.image_name }}:${{ env.MODEL_VERSION }}
            ${{ steps.meta.outputs.image_name }}:latest
          build-args: |
            MODEL_VERSION=${{ env.MODEL_VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Logout from GHCR
        if: always()
        run: docker logout ${{ env.REGISTRY }}

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    environment:
      name: production
    steps:
      - uses: actions/checkout@v4

      # Заглушка под реальный cloud API.
      # В прод-сценарии тут идёт вызов k8s rollout / Yandex Cloud / SberCloud API
      # с использованием secrets.CLOUD_TOKEN. Сейчас оставлен лог с параметрами
      # деплоя чтобы было видно полную форму запроса.
      - name: Deploy via cloud API
        env:
          CLOUD_TOKEN: ${{ secrets.CLOUD_TOKEN }}
        run: |
          echo "[deploy] image=${{ needs.build-and-push.outputs.image_name }}:${{ needs.build-and-push.outputs.image_tag }}"
          echo "[deploy] model_version=${MODEL_VERSION}"
          if [[ -z "${CLOUD_TOKEN:-}" ]]; then
            echo "[deploy] CLOUD_TOKEN secret is not set, skipping real API call"
          else
            echo "[deploy] CLOUD_TOKEN present, would POST rollout request"
          fi

      - name: Health check with retries
        id: health
        continue-on-error: true
        env:
          TARGET_URL: ${{ vars.DEPLOY_HEALTH_URL }}
        run: |
          set +e
          if [[ -z "${TARGET_URL}" ]]; then
            echo "[health] DEPLOY_HEALTH_URL variable not set, skipping (stub deploy)"
            exit 0
          fi
          for attempt in 1 2 3 4 5; do
            echo "[health] attempt ${attempt} -> ${TARGET_URL}"
            if curl -fsS --max-time 5 "${TARGET_URL}" >/dev/null; then
              echo "[health] ok"
              exit 0
            fi
            sleep 10
          done
          echo "[health] all attempts failed"
          exit 1

      - name: Auto rollback on health failure
        if: steps.health.outcome == 'failure'
        env:
          CLOUD_TOKEN: ${{ secrets.CLOUD_TOKEN }}
        run: |
          echo "[rollback] health failed, triggering rollback"
          if [[ -n "${CLOUD_TOKEN:-}" ]]; then
            echo "[rollback] would POST rollback=true to cloud API"
          fi

      - name: Fail job if rollback happened
        if: steps.health.outcome == 'failure'
        run: exit 1
