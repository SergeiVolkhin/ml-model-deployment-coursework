name: ml-hw-8

networks:
  monitoring:
    driver: bridge

volumes:
  prometheus_data:
  grafana_data:
  mlflow_artifacts:

services:
  ml_service:
    build:
      context: ./ml_service
      dockerfile: Dockerfile
    image: ml-hw-8/ml_service:${ML_SERVICE_VERSION:-0.1.0}
    container_name: ml_service
    environment:
      LATENCY_MODE: ${LATENCY_MODE:-normal}
      ML_SERVICE_VERSION: ${ML_SERVICE_VERSION:-0.1.0}
      MLFLOW_TRACKING_URI: ${MLFLOW_TRACKING_URI:-http://mlflow:5000}
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
    depends_on:
      mlflow:
        condition: service_healthy
    networks:
      - monitoring
    restart: unless-stopped

  mlflow:
    image: ghcr.io/mlflow/mlflow:${MLFLOW_TAG:-v3.12.0}
    container_name: mlflow
    command: >
      mlflow server
      --host 0.0.0.0
      --port 5000
      --backend-store-uri sqlite:////mlflow/data/mlflow.db
      --artifacts-destination /mlflow/data/mlruns
      --serve-artifacts
      --allowed-hosts mlflow,mlflow:5000,localhost,localhost:5000,localhost:5001,127.0.0.1,127.0.0.1:5000,127.0.0.1:5001
    volumes:
      - mlflow_artifacts:/mlflow/data
    ports:
      - "5001:5000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:5000/health', timeout=3).status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - monitoring
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:${PROMETHEUS_TAG:-v3.11.3}
    container_name: prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --web.enable-lifecycle
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - monitoring
    depends_on:
      ml_service:
        condition: service_started
    restart: unless-stopped

  grafana:
    image: grafana/grafana:${GRAFANA_TAG:-13.0.1}
    container_name: grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_FEATURE_TOGGLES_ENABLE: "alertingProvisionedDashboards"
      # TG_BOT_TOKEN / TG_CHAT_ID intentionally NOT passed into Grafana env: telegram
      # contact point and notification policy are created post-deploy via
      # scripts/setup_grafana_telegram.ps1 over the REST API. This sidesteps Grafana's
      # YAML provisioning quirk that mangled chatid type (JSON number vs string).
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"
    networks:
      - monitoring
    depends_on:
      prometheus:
        condition: service_started
    restart: unless-stopped
