global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: hw8-local
    project: ml-hw-8

rule_files:
  - alerts.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]

  - job_name: ml_service
    metrics_path: /metrics
    static_configs:
      - targets: [ml_service:8000]
        labels:
          service: ml_service
          tier: ml
