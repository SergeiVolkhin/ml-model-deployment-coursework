apiVersion: 1

groups:
  - orgId: 1
    name: ml_service_slo
    folder: ML
    interval: 1m
    rules:
      - uid: high-latency-p95
        title: HighLatencyP95
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              editorMode: code
              expr: histogram_quantile(0.95, sum(rate(request_latency_seconds_bucket[5m])) by (le))
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params: [1]
                    type: gt
                  operator:
                    type: and
                  query:
                    params: [C]
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold
        noDataState: NoData
        execErrState: Error
        for: 2m
        annotations:
          summary: "ML-сервис превысил SLO p95 latency (1s)"
          description: |
            p95 запросов к ml_service вышел за 1s за окно 5m.
            Действия: проверить LATENCY_MODE, нагрузку и логи контейнера ml_service.
        labels:
          severity: warning
          service: ml_service
